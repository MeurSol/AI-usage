[package]
name = "ai-usage"
version = "0.1.0"
edition = "2021"
description = "macOS menu bar monitor for GPT/Codex and Claude usage limits"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ureq = { version = "3", features = ["json"] }
notify = "8"

objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDate",
    "NSTimer",
    "NSRunLoop",
    "NSThread",
    "NSAttributedString",
    "NSRange",
] }
objc2-app-kit = { version = "0.3", features = [
    "objc2-core-foundation",
    "NSApplication",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSButton",
    "NSControl",
    "NSCell",
    "NSView",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSBezierPath",
    "NSColor",
    "NSAttributedString",
    "NSStringDrawing",
    "NSFont",
    "NSText",
    "NSEvent",
    "NSTrackingArea",
    "block2",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
